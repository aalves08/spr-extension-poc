  empty:
    title: No SUSE Private Registry connected
    description: Connect a SUSE Private Registry instance to see its health, projects, artifacts and vulnerabilities in Rancher.
    cta: Add a connection
    install: "No SUSE Private Registry yet? Install it from Apps > Charts (suse-private-registry), then connect it here."
    noPermission:
      title: Insufficient permissions
      description: Your account cannot read the connection Secrets in the cattle-global-data namespace. Ask a Rancher administrator for access.

  requirements:
    title: Before you install SUSE Private Registry
    intro: The registry must be installed and reachable before you connect it. SUSE recommends this as a starting point for production.
    where: "Where: install it on a dedicated downstream cluster, not on the Rancher management (local) cluster."
    cluster: "Cluster: Kubernetes 1.33 to 1.35 with at least 3 worker nodes of 4 vCPU and 16 GiB RAM each. Use 8 vCPU and 32 GiB if you scan or push a lot of images."
    storage: "Storage: a default StorageClass, or one set in the chart values. The chart default sizes (5 GiB for images) are only for trying it out. Start with 500 GiB to 1 TiB for images and 20 GiB each for the database and Valkey."
    network: "Network: an ingress controller, a DNS name pointing to it and a TLS certificate Rancher trusts. The chart only creates the Ingress rule and uses a placeholder hostname by default, so set your own hostname and external URL."
    link: Read the full requirements

